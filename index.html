<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omega IPA Repo</title>
<style>
 :root{color-scheme:dark}
 body{margin:0;font:16px/1.6 -apple-system,system-ui,sans-serif;background:#0b0d10;color:#e6e9ef}
 .wrap{max-width:720px;margin:0 auto;padding:40px 20px}
 h1{font-size:28px;margin:0 0 6px}.sub{color:#8a94a6;margin:0 0 28px}
 pre,code{background:#05070a;border:1px solid #1d2430;border-radius:10px}
 code{padding:2px 7px}pre{padding:14px;overflow:auto}
 a.btn{display:inline-block;background:#2e5aac;color:#fff;text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:600;margin-right:8px}
 .card{background:#11151b;border:1px solid #1d2430;border-radius:14px;padding:18px;margin:14px 0}
</style></head><body><div class="wrap">
 <h1>Omega IPA Repo</h1>
 <p class="sub">AltStore / SideStore source &middot; self-hosted.</p>
 <div class="card">
  <p>Add this source in <b>AltStore</b> / <b>SideStore</b> (Browse &rarr; Sources &rarr; +):</p>
  <pre id="u">loading…</pre>
  <a class="btn" id="alt" href="#">Add to AltStore</a>
  <a class="btn" id="side" href="#">Add to SideStore</a>
 </div>
 <div class="card">
  <p>Add an IPA: upload it to this repo's <b>Releases</b>, then add an entry in
  <code>apps.json</code> with its <code>downloadURL</code>.</p>
 </div>
 <script>
  const src=location.origin+location.pathname.replace(/index\.html$/,'')+'apps.json';
  document.getElementById('u').textContent=src;
  document.getElementById('alt').href='altstore://source?url='+encodeURIComponent(src);
  document.getElementById('side').href='sidestore://source?url='+encodeURIComponent(src);
 </script>
</div></body></html>
